<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Expense Tracker </title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar-container">
            <h4 class="sidebar-title"> Expense Tracker</h4>
            <!-- Profile -->
            <div class="profile-container">
                <img src="./assets/Profile image 2.jpeg" alt="" class="sidebar-profile-img">
                <div class="sidebar-balance-container">
                    <h5 class="sidebar-balance-title">Total Balance</h5>
                    <p class="sidebar-balance">$12,450.00</p>
                </div>
            </div>
            <button class="sidebar-add-btn">Add Expense</button>
            <!-- Sidebar Options -->
            <ul class="sidebar-options-container">
                <li class="sidebar-option"><a href="#" class="sidebar-option-link">Dashboard</a></li>
                <li class="sidebar-option"><a href="#" class="sidebar-option-link">Transactions</a></li>
                <li class="sidebar-option"><a href="#" class="sidebar-option-link">Categories</a></li>
                <li class="sidebar-option"><a href="#" class="sidebar-option-link">Reports</a></li>
            </ul>
        </div>
    </div>

    <!-- JavaScript connection code -->
    <script src="./script.js"></script>
</body>
</html>
