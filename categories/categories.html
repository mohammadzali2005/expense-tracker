<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage and customize your income and expense categories in Expense Tracker to stay organized and achieve accurate personal finance tracking.">
    <script src="https://kit.fontawesome.com/6fa05d4590.js" crossorigin="anonymous"></script>
    <title> Categories </title>
    <link rel="stylesheet" href="./categories.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar-container">
            <h4 class="sidebar-title"> Expense Tracker</h4>
            <!-- Profile -->
            <div class="profile-container">
                <img src="../assets/Profile image 2.jpeg" alt="" class="sidebar-profile-img">
                <div class="sidebar-balance-container">
                    <h5 class="sidebar-balance-title">Total Balance</h5>
                    <p class="sidebar-balance">$12,450.00</p>
                </div>
            </div>
            <button class="sidebar-add-btn"><i class="fa-solid fa-plus"></i> Add Expense</button>
            <!-- Sidebar Options -->
            <ul class="sidebar-options-container">
                <li class="sidebar-option"><a href="../index.html" class="sidebar-option-link"><i class="fa-solid fa-table-list"></i> Dashboard</a></li>
                <li class="sidebar-option"><a href="../transactions/transactions.html" class="sidebar-option-link"><i class="fa-solid fa-scroll"></i> Transactions</a></li>
                <li class="sidebar-option"><a href="./categories.html" class="sidebar-option-link"><i class="fa-solid fa-cubes-stacked"></i> Categories</a></li>
                <li class="sidebar-option"><a href="../reports/reports.html" class="sidebar-option-link"><i class="fa-solid fa-chart-column"></i> Reports</a></li>
            </ul>
        </div>

        <div class="content">
            <!-- Header -->
            <header>
                <h1 class="header-page-name">Your Categories</h1>
                <p class="header-subtitle">Manage your income and expense categories for accurate tracking.</p>
                <h2 class="header-balance"></h2>
            </header>

            <!-- Categories Container -->
            <section class="categories">
                <div class="category">
                    <i class="fa-solid fa-utensils"></i>
                    <h4 class="category-title">Food & Dining</h4>
                    <p class="category-subtitle">Expense</p>
                    <p class="category-num food-expense"></p>
                </div>
                <div class="category">
                    <i class="fa-solid fa-house"></i>
                    <h4 class="category-title">Housing</h4>
                    <p class="category-subtitle">Expense</p>
                    <p class="category-num housing-expense"></p>
                </div>
                <div class="category">
                    <i class="fa-solid fa-money-bills"></i>
                    <h4 class="category-title">Salary</h4>
                    <p class="category-subtitle">Income</p>
                    <p class="category-num salary"></p>
                </div>
                <div class="category">
                    <i class="fa-solid fa-money-bills"></i>
                    <h4 class="category-title">Transportation</h4>
                    <p class="category-subtitle">Expense</p>
                    <p class="category-num transportation-expense"></p>
                </div>
                <div class="category">
                    <i class="fa-solid fa-face-laugh"></i>
                    <h4 class="category-title">Fun</h4>
                    <p class="category-subtitle">Expense</p>
                    <p class="category-num fun-expense"></p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal">
        <!-- Close Modal Btn -->
        <span class="close-modal-btn"><i class="fa-solid fa-arrow-left"></i></span>
        
        <div class="modal-container">
            <!-- Modal Title -->
            <h3 class="modal-title">Entry</h3>
            <!-- Modal Labels & Inputs -->
            <label for="" class="modal-desc-label">Description</label>
            <input type="text" class="modal-desc-input">

            <div class="modal-inputs-container">
                <div>
                    <label for="" class="modal-amount-label">Amount</label>
                <input type="number" class="modal-amount-input" placeholder="$">
                </div>
                <div>
                    <label for="" class="modal-type-label">Type</label>
                <select name="" id="" class="modal-type-select">
                    <option value="Expense" class="modal-option">Expense</option>
                    <option value="Income" class="modal-option">Income</option>
                </select>
                </div>
            </div>

            <label for="" class="modal-category-label">Category</label>
            <select name="" id="" class="modal-category-select">
                <option value="Food & Dining" class="category-option">Food & Dining</option>
                <option value="Utilities" class="category-option">Housing</option>
                <option value="Salary" class="category-option">Salary</option>
                <option value="Residence" class="category-option">Transportation</option>
                <option value="Break" class="category-option">Fun</option>
            </select>
            <!-- Modal Add Btn -->
            <button class="modal-add-btn">Add Transaction</button>
        </div>
    </div>


    <script src="./categories.js" type="module"></script>
</body>
</html>
